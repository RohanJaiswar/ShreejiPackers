<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Packer Login - Shreeji Milk Center</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#C5A049" />
  <link rel="apple-touch-icon" href="assets/logo-invoice.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <style>
    :root {
      --primary: #C5A049;
      --primary-dark: #A68332;
      --primary-light: #FDF9F1;
      --text-main: #111827;
      --text-secondary: #4B5563;
      --text-muted: #9CA3AF;
      --bg-body: #FAFAFA;
      --bg-card: #FFFFFF;
      --border: #E5E7EB;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --danger: #EF4444;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-body);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .header-bg {
      background: linear-gradient(135deg, #0F172A, #1E293B);
      height: 45vh;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .login-container {
      background: var(--bg-card);
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .login-logo {
      margin-bottom: 24px;
      display: inline-block;
      padding: 16px;
      background: var(--primary-light);
      border-radius: 20px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .login-logo img {
      height: 60px;
      object-fit: contain;
    }
    .login-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .login-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-weight: 400;
    }
    .form-group {
      text-align: left;
      margin-bottom: 24px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .input-icon-wrapper {
      position: relative;
    }
    .input-icon-wrapper ion-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 20px;
      transition: color 0.3s ease;
    }
    .form-group input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      background: #F9FAFB;
    }
    .form-group input::placeholder {
      color: #9CA3AF;
      font-weight: 400;
    }
    .form-group input:focus {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(197, 160, 73, 0.1);
    }
    .form-group input:focus + ion-icon, 
    .form-group input:not(:placeholder-shown) ~ ion-icon {
      color: var(--primary);
    }
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(197, 160, 73, 0.3);
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(197, 160, 73, 0.4);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    #errorMsg {
      color: var(--danger);
      background: #FEF2F2;
      border: 1px solid #FEE2E2;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 20px;
      display: none;
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header-bg"></div>
  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-logo">
        <img src="assets/logo-invoice.png" alt="Shreeji Milk Center" />
      </div>
      <div class="login-title">Packer Portal</div>
      <div class="login-subtitle">Secure access for packing partners</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Partner ID</label>
          <div class="input-icon-wrapper">
            <input type="text" id="username" placeholder="Enter your ID" required />
            <ion-icon name="person-outline"></ion-icon>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Security Code</label>
          <div class="input-icon-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required />
            <ion-icon name="lock-closed-outline"></ion-icon>
          </div>
        </div>
        <button type="submit" class="login-btn">
          <span>Authenticate</span>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </button>
        <div id="errorMsg">
          <ion-icon name="alert-circle" style="vertical-align: text-bottom; font-size: 16px; margin-right: 4px;"></ion-icon>
          Invalid credentials provided
        </div>
      </form>
      <div class="footer-text">
        &copy; 2026 Shreeji Milk Center. All rights reserved.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tqtvxtipqbnvyquljgtg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_na3VEkRe9gb7Nysy5crL1g_oR-M2W9x';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const btn = document.querySelector('.login-btn');
      const errorMsg = document.getElementById('errorMsg');
      
      btn.innerHTML = '<ion-icon name="reload-outline" style="animation: spin 1s linear infinite;"></ion-icon> <span>Verifying...</span>';
      errorMsg.style.display = 'none';
      
      try {
        const { data, error } = await supabaseClient
          .from('packers')
          .select('*')
          .eq('email', user)
          .eq('password', pass)
          .single();

        if (error || !data) {
          throw new Error('Invalid credentials');
        }

        sessionStorage.setItem('packerUser', data.email);
        sessionStorage.setItem('packerName', data.name);
        window.location.href = 'packer.html';
      } catch (err) {
        btn.innerHTML = '<span>Authenticate</span> <ion-icon name="arrow-forward-outline"></ion-icon>';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
